<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculadora de Salario | Dementes</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: https://github.com/rafgraph/spa-github-pages
      // GH Pages serves this for any unknown path (e.g. /dementes/cop); it
      // re-encodes the path into a query string on the real index.html, which
      // index.html then decodes and restores via history.replaceState.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
